name: Full Test Suite

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "latest"

jobs:
  # ─────────────────────────────────────────────────────────
  # LLM-Free Unit Tests (Fast, No External Dependencies)
  # ─────────────────────────────────────────────────────────
  llm-free:
    name: LLM-Free Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-core
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        run: pip install uv
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Sync dependencies
        run: uv sync
      
      - name: Run LLM-free tests
        run: |
          uv run pytest tests/test_llm_free_*.py \
            -v \
            --tb=short \
            --junitxml=test-results/llm-free.xml \
            -q
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-free-test-results
          path: apps/agent-core/test-results/

  # ─────────────────────────────────────────────────────────
  # Performance Tests
  # ─────────────────────────────────────────────────────────
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-core
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        run: pip install uv
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Sync dependencies
        run: uv sync
      
      - name: Run performance tests
        run: |
          uv run pytest tests/performance/ \
            -v \
            --tb=short \
            --junitxml=test-results/performance.xml \
            -q
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: apps/agent-core/test-results/

  # ─────────────────────────────────────────────────────────
  # Security Tests
  # ─────────────────────────────────────────────────────────
  security:
    name: Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-core
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        run: pip install uv
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Sync dependencies
        run: uv sync
      
      - name: Run security tests
        run: |
          uv run pytest tests/security/ \
            -v \
            --tb=short \
            --junitxml=test-results/security.xml \
            -q
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: apps/agent-core/test-results/

  # ─────────────────────────────────────────────────────────
  # Integration Tests (Docker-backed)
  # ─────────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [llm-free]  # Only run if unit tests pass
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    defaults:
      run:
        working-directory: apps/agent-core
    
    env:
      DATABASE_URL: postgresql://supabase_admin:postgres@localhost:5433/postgres
      REDIS_URL: redis://localhost:6379
      LLM_PROVIDER: mock
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        run: pip install uv
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Sync dependencies
        run: uv sync
      
      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U supabase_admin; then
              echo "PostgreSQL is ready!"
              break
            fi
            sleep 1
          done
          
          echo "Waiting for Redis..."
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping; then
              echo "Redis is ready!"
              break
            fi
            sleep 1
          done
        working-directory: /
      
      - name: Run integration tests
        run: |
          uv run pytest tests/test_e2e_mock_llm.py tests/test_graph.py \
            -v \
            --tb=short \
            --junitxml=test-results/integration.xml \
            -q
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: apps/agent-core/test-results/

  # ─────────────────────────────────────────────────────────
  # Security Scan (Static Analysis)
  # ─────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [llm-free]
    
    defaults:
      run:
        working-directory: apps/agent-core
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install uv
        run: pip install uv
      
      - name: Install Bandit
        run: uv add --dev bandit
      
      - name: Run Bandit security scanner
        run: |
          uv run bandit -r src/ \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            || true
      
      - name: Display security report
        run: |
          if [ -f bandit-report.json ]; then
            cat bandit-report.json | python -m json.tool
          fi
      
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: apps/agent-core/bandit-report.json

  # ─────────────────────────────────────────────────────────
  # Test Summary
  # ─────────────────────────────────────────────────────────
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [llm-free, performance, security, integration, security-scan]
    if: always()
    
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results/
      
      - name: Generate test summary
        run: |
          echo "# Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for result in test-results/*/; do
            if [ -d "$result" ]; then
              name=$(basename "$result")
              echo "### $name" >> $GITHUB_STEP_SUMMARY
              echo "✅ Completed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- LLM-free test results" >> $GITHUB_STEP_SUMMARY
          echo "- Performance test results" >> $GITHUB_STEP_SUMMARY
          echo "- Security test results" >> $GITHUB_STEP_SUMMARY
          echo "- Integration test results" >> $GITHUB_STEP_SUMMARY
          echo "- Security scan report" >> $GITHUB_STEP_SUMMARY
