# Smart Commerce Agent - Development Docker Compose
#
# This file is used for local development AND can be deployed to Azure Container Apps
# using: az containerapp compose create --compose-file-path docker-compose.yml
#
# Architecture:
# - Local: PostgreSQL + Redis + Langfuse (all Docker)
# - Remote LLM: Azure AI Foundry (configured via .env.local)
# - Same config works for dev AND prod deployment

services:
  # ============================================
  # Core Infrastructure
  # ============================================

  # Primary Database with pgvector (PostgreSQL 16)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smart-commerce-postgres
    environment:
      POSTGRES_DB: smart_commerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_commerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # State & Checkpointing
  # ============================================

  # Redis for LangGraph checkpointing + RAG cache
  redis:
    image: redis:7-alpine
    container_name: smart-commerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Observability (Self-hosted Langfuse)
  # ============================================

  langfuse:
    image: langfuse/langfuse:latest
    container_name: smart-commerce-langfuse
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/langfuse
      - NEXTAUTH_SECRET=dev-secret-change-in-prod
      - NEXTAUTH_URL=http://localhost:3001
      - TELEMETRY_ENABLED=false
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - langfuse_data:/var/lib/langfuse

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
  redis_data:
  langfuse_data:

# ============================================
# External Services (configured via .env.local)
# ============================================
# - Azure AI Foundry: LLM endpoint (remote)
#   Configure in .env.local: AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY
# - Ollama (optional fallback): localhost:11434
#   docker run -d -v ollama:/root/.ollama -p 11434:11434 --name ollama ollama/ollama
