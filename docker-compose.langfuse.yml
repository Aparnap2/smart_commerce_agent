# Langfuse — Optional observability service
# Run separately: docker compose -f docker-compose.langfuse.yml up -d
# High memory usage (~400MB) — only start when needed

version: '3.9'

services:
  langfuse:
    image: langfuse/langfuse:latest
    container_name: smart-commerce-langfuse
    environment:
      DATABASE_URL:      postgresql://postgres:postgres@host.docker.internal:5432/langfuse
      NEXTAUTH_SECRET:   ${LANGFUSE_NEXTAUTH_SECRET:-dev-secret}
      NEXTAUTH_URL:      http://localhost:3003
      TELEMETRY_ENABLED: "false"
    ports:
      - "3003:3000"
    deploy:
      resources:
        limits:
          memory: 384M
